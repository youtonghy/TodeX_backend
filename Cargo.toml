[package]
name = "todex-agentd"
version = "0.0.0"
edition = "2021"

[dependencies]
agent-client-protocol = "2.0"
anyhow = "1"
arboard = { version = "3", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dashmap = "6"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
if-addrs = "0.15"
json5 = "0.4"
libc = "0.2"
pqcrypto-mlkem = "0.1"
pqcrypto-traits = "0.3"
portable-pty = "0.9"
qrcodegen = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "=3.1.3", default-features = false, features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "rsa", "encryption", "getrandom"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
toml_edit = "0.22"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
# History v3: sealed journal segments are raw-DEFLATE frames (clients
# decompress e2e frames, and browsers can inflate raw DEFLATE natively); LRU
# caches bound decompressed frames and conversation indexes.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lru = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# History crypto v1: X-Wing (ML-KEM-768 + X25519, draft-06) device keys.
x-wing = { version = "0.1.1", features = ["getrandom", "zeroize"] }
ed25519-dalek = "2"
russh-sftp = "3.0.1"
suppaftp = { version = "12", features = ["tokio-rustls-ring"] }
webpki-roots = "1"
# Computer Use: accessibility trees, input and screenshots on every desktop.
# Pinned exactly: a 0.x API behind our own `computer` module.
xa11y = "=0.15.2"
jpeg-encoder = "0.7"
# Agent browser: the DevTools socket on Windows, and unpacking Chromium.
tokio-tungstenite = "0.29"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
xa11y-macos = "=0.15.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
global-hotkey = "0.8"
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
xa11y-windows = "=0.15.2"
# Same major as xa11y-windows, so one `windows` build serves both.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
xa11y-linux = "=0.15.2"
# The versions and feature sets xa11y-linux already builds.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
x11rb = { version = "0.14", default-features = false, features = ["randr", "res", "screensaver"] }
# KDE Plasma Wayland: idle notifications (staging protocols) and the
# Screenshot portal's PNG, at the versions xa11y-linux already builds.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
png = "0.18"

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tungstenite = "0.29"

# RSA key generation (`POST /v2/ssh/keys/generate`) takes minutes with
# unoptimized bignum code; optimize just these crates in dev/test builds.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Sealing a 64 MiB journal segment compresses it; unoptimized DEFLATE makes
# debug builds and tests needlessly slow.
[profile.dev.package.miniz_oxide]
opt-level = 3

# xa11y-linux links libxkbcommon, which would make the daemon fail to start
# (and the Linux release fail to link) where it is not installed; this copy
# of the API it uses loads the library at run time instead.
[patch.crates-io]
xkbcommon = { path = "crates/xkbcommon" }
