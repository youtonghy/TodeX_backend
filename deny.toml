# cargo-deny: the "Dependency audit" job in .github/workflows/checks.yml.
# An advisory fails CI until a dependency upgrade fixes it, or it is ignored
# below with the reason it cannot be fixed yet.

[graph]
# The release targets (.github/workflows/build-binaries.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa (via ssh-key) has no constant-time release yet; it only generates and signs with local SSH keys, with no RSA decryption an attacker can time" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (via serde_yaml_ng, the latest release) only parses local DeepSeek Harness config files" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; xa11y-linux still requires zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; xa11y-linux still requires zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; xa11y-linux still requires zbus 5" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
