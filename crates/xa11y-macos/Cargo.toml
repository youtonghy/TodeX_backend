# xa11y-macos 0.15.2 (MIT, https://github.com/xa11y/xa11y), taken in through
# the root Cargo.toml's [patch.crates-io] so Computer Use can extend it.
[package]
name = "xa11y-macos"
version = "0.15.2"
edition = "2021"
rust-version = "1.88"
description = "macOS accessibility backend for xa11y (AXUIElement)"
license = "MIT"
repository = "https://github.com/xa11y/xa11y"
publish = false
build = "build.rs"

[lib]
name = "xa11y_macos"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
xa11y-core = { version = "=0.15.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
rayon = "1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
