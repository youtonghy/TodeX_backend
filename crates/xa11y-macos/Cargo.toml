# xa11y-macos 0.15.2 (MIT, https://github.com/xa11y/xa11y), taken in through
# the root Cargo.toml's [patch.crates-io] with additions Computer Use needs
# and upstream lacks (0.16.0 neither): window elements carry their
# window-server number (`ax_window_number`), and windows in another desktop
# Space, which `AXWindows` leaves out, can be reached by number
# (`MacOSProvider::windows_by_number`). Expand and collapse also try
# `AXDisclosing` (outline rows) when `AXExpanded` is not settable. Every
# change is marked `TodeX:`; the rest is upstream's code unchanged.
[package]
name = "xa11y-macos"
version = "0.15.2"
edition = "2021"
rust-version = "1.88"
description = "macOS accessibility backend for xa11y (AXUIElement)"
license = "MIT"
repository = "https://github.com/xa11y/xa11y"
publish = false
build = "build.rs"

[lib]
name = "xa11y_macos"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
xa11y-core = { version = "=0.15.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
rayon = "1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
