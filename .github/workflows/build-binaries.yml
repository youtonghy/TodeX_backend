name: Release backend binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use stable SemVer format X.Y.Z." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

  source:
    name: Tag release source
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git tag "${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  validate:
    name: Test backend
    needs:
      - prepare
      - source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TODEX_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      TODEX_RELEASE_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Validate backend
        run: |
          cargo fmt --all --check
          cargo check --locked --all-targets --all-features
          cargo test --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features

  build:
    name: Build ${{ matrix.label }}
    needs:
      - prepare
      - source
      - validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TODEX_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      TODEX_RELEASE_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linked by Zig against an older glibc so the binary runs on Debian 10+,
          # Ubuntu 20.04+, and RHEL 8+ rather than only the runner's glibc.
          - os: ubuntu-24.04
            label: linux-x64-gnu
            archive: tar.gz
            cargo_target: x86_64-unknown-linux-gnu
            glibc: "2.28"
          - os: macos-15
            label: macos-arm64
            archive: tar.gz
          - os: windows-2025
            label: windows-x64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      # macOS TCC keys Screen Recording and Accessibility grants for a bare binary
      # to its code signature, so every release must be signed with the same
      # identity or each auto-update silently drops the Computer Use permissions.
      - name: Require macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [[ -z "${CSC_LINK}" ]]; then
            echo "MAC_CSC_LINK must contain a code signing certificate (Developer ID Application or self-signed) so macOS Computer Use permissions survive auto-updates." >&2
            exit 1
          fi

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-zigbuild
        if: ${{ matrix.glibc }}
        run: |
          rustup target add "${{ matrix.cargo_target }}"
          python3 -m venv "${RUNNER_TEMP}/zigbuild"
          "${RUNNER_TEMP}/zigbuild/bin/pip" install --disable-pip-version-check cargo-zigbuild==0.23.4 ziglang==0.16.0
          # cargo-zigbuild locates Zig through `python3 -m ziglang`, so the venv must come first on PATH.
          echo "${RUNNER_TEMP}/zigbuild/bin" >> "${GITHUB_PATH}"

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET: ${{ matrix.cargo_target }}
          GLIBC_VERSION: ${{ matrix.glibc }}
        run: |
          if [[ -n "${GLIBC_VERSION}" ]]; then
            # With Cargo's default debuginfo strip, Zig's linker also drops the symbol
            # table. Link unstripped, then remove only debug info so panic backtraces
            # keep function names like the other platforms.
            CARGO_PROFILE_RELEASE_STRIP=none cargo zigbuild --release --locked --target "${CARGO_TARGET}.${GLIBC_VERSION}"
            objcopy --strip-debug "target/${CARGO_TARGET}/release/todex-agentd"
          else
            cargo build --release --locked
          fi

      - name: Import macOS signing certificate
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/todex-signing.keychain-db
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          printf '%s' "${CSC_LINK}" | base64 --decode > "${workdir}/signing.p12"

          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::${keychain_password}"
          security create-keychain -p "${keychain_password}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${keychain_password}" "${KEYCHAIN_PATH}"
          # Prepend to the user search list so codesign can find the identity.
          search_list=("${KEYCHAIN_PATH}")
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            if [[ -n "${keychain}" ]]; then
              search_list+=("${keychain}")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          security import "${workdir}/signing.p12" -k "${KEYCHAIN_PATH}" -f pkcs12 \
            -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${keychain_password}" "${KEYCHAIN_PATH}" >/dev/null

          # Without -v so an untrusted self-signed identity is listed too; such lines
          # end with a trust error such as (CSSMERR_TP_NOT_TRUSTED).
          identities="$(security find-identity -p codesigning "${KEYCHAIN_PATH}" \
            | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "([^"]*)".*$/\1 \2/p' | sort -u)"
          identity_count="$(grep -c . <<<"${identities}" || true)"
          if [[ "${identity_count}" -ne 1 ]]; then
            echo "MAC_CSC_LINK must contain exactly one code signing identity; found ${identity_count}." >&2
            exit 1
          fi
          identity_hash="${identities%% *}"
          identity_name="${identities#* }"

          developer_id=false
          if [[ "${identity_name}" == "Developer ID Application:"* ]]; then
            developer_id=true
          else
            # codesign rejects an untrusted certificate, so trust the self-signed
            # one for code signing on this ephemeral runner, like the desktop release.
            security find-certificate -c "${identity_name}" -p "${KEYCHAIN_PATH}" > "${workdir}/signing.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign "${workdir}/signing.pem"
          fi
          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -q "${identity_hash}"; then
            echo "Signing identity ${identity_name} is not valid for code signing." >&2
            exit 1
          fi

          echo "Signing identity: ${identity_name} (${identity_hash}); Developer ID: ${developer_id}"
          echo "identity=${identity_hash}" >> "${GITHUB_OUTPUT}"
          echo "developer_id=${developer_id}" >> "${GITHUB_OUTPUT}"

      # Signs in place before packaging, so the archive, the raw update asset, and
      # SHA256SUMS (computed in the release job) all cover the signed binary.
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          DEVELOPER_ID: ${{ steps.signing.outputs.developer_id }}
          KEYCHAIN_PATH: ${{ runner.temp }}/todex-signing.keychain-db
          BINARY_PATH: target/release/todex-agentd
          SIGNING_IDENTIFIER: com.unbaked0692.todex.agentd
        run: |
          sign() {
            codesign --force --options runtime "$1" --identifier "${SIGNING_IDENTIFIER}" \
              --keychain "${KEYCHAIN_PATH}" --sign "${SIGNING_IDENTITY}" "${BINARY_PATH}"
          }
          # A secure timestamp needs Apple's timestamp server and is mandatory for
          # notarization. TCC grants do not depend on it, so a self-signed build
          # falls back to no timestamp when the server rejects or cannot be reached.
          if ! sign --timestamp; then
            if [[ "${DEVELOPER_ID}" == "true" ]]; then
              echo "Timestamped signing failed; Developer ID builds require a secure timestamp." >&2
              exit 1
            fi
            echo "::warning::Timestamped signing failed; signing the self-signed build without a timestamp."
            sign --timestamp=none
          fi

          codesign --verify --strict --verbose=2 "${BINARY_PATH}"
          details="$(codesign -dv --verbose=2 "${BINARY_PATH}" 2>&1)"
          echo "${details}"
          if ! grep -qx "Identifier=${SIGNING_IDENTIFIER}" <<<"${details}" \
            || ! grep -q '(runtime)' <<<"${details}" \
            || grep -q '^Signature=adhoc' <<<"${details}"; then
            echo "Signed binary lacks the expected identifier, hardened runtime, or certificate." >&2
            exit 1
          fi

      # Bare executables cannot be stapled; Gatekeeper looks the ticket up online.
      - name: Notarize macOS binary
        if: runner.os == 'macOS' && steps.signing.outputs.developer_id == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BINARY_PATH: target/release/todex-agentd
        run: |
          if [[ -z "${APPLE_ID}" || -z "${APPLE_APP_SPECIFIC_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::warning::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, or APPLE_TEAM_ID is missing; skipping notarization."
            exit 0
          fi

          archive="${RUNNER_TEMP}/todex-agentd-notarize.zip"
          ditto -c -k --keepParent "${BINARY_PATH}" "${archive}"
          credentials=(--apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" --team-id "${APPLE_TEAM_ID}")
          submit_status=0
          result="$(xcrun notarytool submit "${archive}" "${credentials[@]}" --wait --output-format json)" || submit_status=$?
          rm -f "${archive}"
          echo "${result}"
          submission_id="$(jq -r '.id // empty' <<<"${result}" 2>/dev/null || true)"
          status="$(jq -r '.status // empty' <<<"${result}" 2>/dev/null || true)"
          if [[ "${submit_status}" -ne 0 || "${status}" != "Accepted" ]]; then
            echo "Notarization failed (exit ${submit_status}, status ${status:-unknown})." >&2
            if [[ -n "${submission_id}" ]]; then
              xcrun notarytool log "${submission_id}" "${credentials[@]}" \
                || echo "Could not fetch the notarization log for ${submission_id}." >&2
            fi
            exit 1
          fi

      - name: Verify glibc compatibility
        if: ${{ matrix.glibc }}
        env:
          BINARY_PATH: target/${{ matrix.cargo_target }}/release/todex-agentd
          GLIBC_VERSION: ${{ matrix.glibc }}
        run: |
          required="$(objdump -T "${BINARY_PATH}" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n1)"
          echo "Highest required glibc symbol version: ${required}"
          if [[ -z "${required}" || "$(printf '%s\n%s\n' "${required}" "${GLIBC_VERSION}" | sort -V | tail -n1)" != "${GLIBC_VERSION}" ]]; then
            echo "Binary requires glibc ${required:-unknown}, above the ${GLIBC_VERSION} baseline." >&2
            exit 1
          fi

      - name: Verify and package binary
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM_LABEL: ${{ matrix.label }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
          CARGO_TARGET: ${{ matrix.cargo_target }}
        run: |
          binary_name="todex-agentd"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary_name="todex-agentd.exe"
          fi

          binary_dir="target/release"
          if [[ -n "${CARGO_TARGET}" ]]; then
            binary_dir="target/${CARGO_TARGET}/release"
          fi
          binary_path="${binary_dir}/${binary_name}"
          actual_version="$("${binary_path}" --version)"
          if [[ "${actual_version}" != "todex-agentd ${RELEASE_VERSION}" ]]; then
            echo "Unexpected binary version: ${actual_version}" >&2
            exit 1
          fi

          package_name="todex-agentd-v${RELEASE_VERSION}-${PLATFORM_LABEL}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp "${binary_path}" "${package_dir}/"
          update_name="${package_name}.bin"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            update_name="${package_name}.exe"
          fi
          cp "${binary_path}" "dist/${update_name}"
          echo "update_path=dist/${update_name}" >> "${GITHUB_OUTPUT}"
          cp README.md LICENSE "${package_dir}/"
          cp docs/BUILD_RUN.md "${package_dir}/"

          pushd dist >/dev/null
          if [[ "${ARCHIVE_FORMAT}" == "zip" ]]; then
            archive_name="${package_name}.zip"
            7z a "${archive_name}" "${package_name}" >/dev/null
          else
            archive_name="${package_name}.tar.gz"
            tar -czf "${archive_name}" "${package_name}"
          fi
          popd >/dev/null

          echo "artifact_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.update_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Delete macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/todex-signing.keychain-db
        run: |
          if [[ -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}"
          fi

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - source
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [[ "${tag_sha}" != "${SOURCE_SHA}" ]]; then
            echo "Release tag moved from ${SOURCE_SHA} to ${tag_sha}." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --draft

          gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}"
          find dist -maxdepth 1 -type f -exec basename {} \; | sort > expected-assets.txt
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' | sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt

          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

  cleanup:
    name: Clean up a failed release
    if: ${{ always() && needs.source.outputs.sha != '' && needs.release.result != 'success' }}
    needs:
      - prepare
      - source
      - validate
      - build
      - release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete draft and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -z "${tag_sha}" ]]; then
            exit 0
          fi
          if [[ "${tag_sha}" != "${SOURCE_SHA}" ]]; then
            echo "Tag ${RELEASE_TAG} no longer belongs to this run; leaving it untouched." >&2
            exit 0
          fi

          repository_name="${GITHUB_REPOSITORY#*/}"
          release_state="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f name="${repository_name}" \
            -f tag="${RELEASE_TAG}" \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { isDraft } } }' \
            --jq '.data.repository.release | if . == null then "missing" elif .isDraft then "draft" else "public" end')"
          if [[ "${release_state}" == "public" ]]; then
            echo "Release ${RELEASE_TAG} is public; leaving it and its tag untouched." >&2
            exit 0
          fi
          if [[ "${release_state}" == "draft" ]]; then
            gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes
          elif [[ "${release_state}" != "missing" ]]; then
            echo "Unexpected Release state; leaving ${RELEASE_TAG} untouched." >&2
            exit 1
          fi

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ "${tag_sha}" == "${SOURCE_SHA}" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
          fi
