name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes its running
# checks; main keeps every run so each merged commit has a result.
concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Test ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # One RUSTFLAGS value for check, Clippy and tests, so they share compiled
    # dependencies instead of each rebuilding them.
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      # The same runners as the release build matrix.
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-15
            label: macos-arm64
          - os: windows-2025
            label: windows-x64
          - os: windows-11-arm
            label: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      # Only main saves the cache, so pull requests cannot poison it.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check all targets
        run: cargo check --locked --all-targets --all-features

      # Advisory until the existing lints are fixed: capped at warn so the
      # job-wide -D warnings, which check already enforces, does not fail it.
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- --cap-lints warn

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
