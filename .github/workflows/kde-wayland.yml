# Computer Use on KDE Plasma Wayland in a headless KWin (ci/kde-wayland).
# Unverified until it has run on GitHub: package names, KWin flags and the
# portal pre-authorization were written without a run to confirm them.
name: KDE Wayland Computer Use

on:
  pull_request:
    paths:
      - "src/computer/**"
      - "ci/kde-wayland/**"
      - ".github/workflows/kde-wayland.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - "src/computer/**"
      - "ci/kde-wayland/**"
      - ".github/workflows/kde-wayland.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kde-wayland:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install KDE, portals and toolchain
        run: |
          pacman -Syu --noconfirm --needed git base-devel rustup dbus kwin kservice \
            xdg-desktop-portal xdg-desktop-portal-kde pipewire wireplumber \
            at-spi2-core python pyside6 ttf-dejavu
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the KDE Wayland test
        run: sh ci/kde-wayland/run.sh
