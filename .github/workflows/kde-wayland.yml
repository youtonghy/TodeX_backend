# Computer Use on KDE Plasma Wayland in a headless KWin (ci/kde-wayland).
# Hosted runners have no GPU render node, without which KWin can neither
# take screenshots nor stream screens for portal input, so this run covers
# observation and window focus only (see run.sh).
name: KDE Wayland Computer Use

on:
  pull_request:
    paths:
      - "src/computer/**"
      - "ci/kde-wayland/**"
      - ".github/workflows/kde-wayland.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - "src/computer/**"
      - "ci/kde-wayland/**"
      - ".github/workflows/kde-wayland.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kde-wayland:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install KDE, portals and toolchain
        run: |
          pacman -Syu --noconfirm --needed git base-devel rustup dbus kwin kservice \
            xdg-desktop-portal xdg-desktop-portal-kde pipewire wireplumber \
            at-spi2-core python pyside6 ttf-dejavu libcap
          # KWin carries cap_sys_nice as a file capability, which Docker's
          # bounding set lacks, so exec fails with EPERM until it is dropped.
          setcap -r /usr/bin/kwin_wayland
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the KDE Wayland test
        run: sh ci/kde-wayland/run.sh
